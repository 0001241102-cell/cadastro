<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro | VioletFlix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topo">
    <span class="logo">VioletFlix</span>
    <button type="button" class="btn btn-contorno" onclick="window.location.href='index.html'">
      Voltar
    </button>
  </header>

  <main class="centro">
    <form id="formCadastro" class="form-cadastro" novalidate>
      <h1>Crie sua conta</h1>

      <div class="foto-perfil">
        <img id="previa" src="" alt="Prévia da foto de perfil" hidden>
        <span id="semFoto" class="sem-foto">Sem foto</span>
        <label for="foto" class="btn btn-contorno">Escolher foto de perfil</label>
        <input type="file" id="foto" name="foto" accept="image/*" hidden>
      </div>

      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>

      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" placeholder="voce@email.com" required>

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" placeholder="Mínimo de 6 caracteres" minlength="6" required>

      <label for="cpf">CPF</label>
      <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" inputmode="numeric" required>

      <label for="endereco">Endereço</label>
<input type="text" id="endereco" name="endereco" placeholder="Rua, número, bairro e cidade" required>

      <p id="mensagem" class="mensagem" role="alert"></p>

      <button type="submit" class="btn btn-principal">Cadastrar</button>
    </form>
  </main>

  <footer class="rodape">
    <p>&copy; 2026 VioletFlix. Projeto de aula.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
